<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <mask id="screen">
      <rect width="1080" height="1920" fill="white"/>
      <rect x="40" y="60" width="1000" height="1800" rx="56" fill="black"/>
    </mask>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" rx="64" fill="#1c1c1e" mask="url(#screen)" filter="url(#shadow)"/>
  <rect x="420" y="28" width="240" height="32" rx="16" fill="#2c2c2e"/>
</svg>
