<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <mask id="screen">
      <rect width="1080" height="1920" fill="white"/>
      <rect x="24" y="48" width="1032" height="1824" rx="32" fill="black"/>
    </mask>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" rx="40" fill="#2c2c2e" mask="url(#screen)" filter="url(#shadow)"/>
  <rect x="500" y="20" width="80" height="8" rx="4" fill="#48484a"/>
</svg>
