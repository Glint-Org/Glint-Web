<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <mask id="screen">
      <rect width="1080" height="1920" fill="white"/>
      <rect x="10" y="70" width="1060" height="1780" rx="18" fill="black"/>
    </mask>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" rx="44" fill="#111111" mask="url(#screen)" filter="url(#shadow)"/>
  <circle cx="540" cy="40" r="5" fill="#222"/>
  <rect x="480" y="1840" width="120" height="6" rx="3" fill="#2a2a2a"/>
</svg>
